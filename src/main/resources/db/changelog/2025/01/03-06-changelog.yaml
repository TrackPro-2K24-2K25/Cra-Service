databaseChangeLog:
  - changeSet:
      id: 1735913771240-1
      author: Youcode
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_bank_account
                  name: id
                  type: UUID
              - column:
                  name: account_number
                  type: VARCHAR(255)
              - column:
                  name: bank_name
                  type: VARCHAR(255)
              - column:
                  name: iban
                  type: VARCHAR(255)
              - column:
                  name: bic
                  type: VARCHAR(255)
              - column:
                  name: company_id
                  type: UUID
            tableName: bank_account
  - changeSet:
      id: 1735913771240-2
      author: Youcode
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: company_id
            baseTableName: bank_account
            constraintName: FK_BANK_ACCOUNT_ON_COMPANY
            referencedColumnNames: id
            referencedTableName: company

